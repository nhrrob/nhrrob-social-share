<!doctype html>
<html><head><meta charset="utf-8"><title>Icon</title>
<style>
	html, body { margin: 0; background: transparent; }
	.icon { width: 256px; height: 256px; }
</style></head>
<body>
<!-- The app bar's share icon, three linked dots, on the plugin's indigo. -->
<svg class="icon" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#3730a3"/>
			<stop offset="1" stop-color="#6366f1"/>
		</linearGradient>
	</defs>
	<rect width="256" height="256" rx="48" fill="url(#bg)"/>
	<g stroke="#fff" stroke-opacity="0.7" stroke-width="14" stroke-linecap="round">
		<line x1="88" y1="128" x2="170" y2="80"/>
		<line x1="88" y1="128" x2="170" y2="176"/>
	</g>
	<circle cx="84" cy="128" r="30" fill="#fff"/>
	<circle cx="174" cy="78" r="28" fill="#fff" fill-opacity="0.9"/>
	<circle cx="174" cy="178" r="28" fill="#fff" fill-opacity="0.9"/>
</svg>
</body></html>
