<!doctype html>
<html><head><meta charset="utf-8"><title>Banner</title>
<style>
	html, body { margin: 0; }
	body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
	.banner { position: relative; overflow: hidden; width: 772px; height: 250px; color: #fff;
		background: linear-gradient(120deg, #2e2a8a 0%, #3730a3 50%, #6366f1 100%); }
	.glow { position: absolute; border-radius: 50%; background: #fff; opacity: .06; }
	.text { position: absolute; left: 48px; top: 44px; width: 390px; }
	.brand { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600; }
	.brand svg { width: 38px; height: 38px; }
	h1 { margin: 22px 0 0; font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
	p { margin: 16px 0 0; font-size: 13.5px; opacity: .9; }
	.card { position: absolute; right: 48px; top: 30px; width: 262px; border-radius: 14px; overflow: hidden;
		background: #fff; color: #1d2327; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
	.og { background: #11161c; color: #e8edf2; padding: 16px 16px 12px; height: 104px; box-sizing: border-box; position: relative; }
	.og .site { font-size: 8px; color: #e8edf2; display: flex; align-items: center; gap: 5px; }
	.og .site i { width: 5px; height: 5px; border-radius: 50%; background: #62cb31; }
	.og h2 { margin: 12px 0 0; font-size: 15px; line-height: 1.2; font-weight: 600; }
	.og .foot { position: absolute; left: 16px; right: 16px; bottom: 9px; display: flex; justify-content: space-between;
		font: 7px ui-monospace, Menlo, monospace; color: #a3afbb; }
	.og .foot b { color: #7bdb4f; font-weight: 400; }
	.meta { padding: 9px 14px 4px; font-size: 10px; color: #55606a; }
	.meta strong { display: block; color: #1d2327; font-size: 11.5px; }
	.btns { display: flex; gap: 5px; padding: 8px 14px 13px; flex-wrap: wrap; }
	.btns span { font-size: 9.5px; padding: 4px 8px; border: 1px solid #dcdcde; border-radius: 999px; }
	.btns span.on { background: #4338ca; border-color: #4338ca; color: #fff; }
</style></head>
<body>
<div class="banner">
	<div class="glow" style="width:420px;height:420px;right:-120px;top:-170px"></div>
	<div class="glow" style="width:260px;height:260px;right:150px;top:150px"></div>
	<div class="text">
		<div class="brand">
			<svg viewBox="0 0 256 256"><rect width="256" height="256" rx="56" fill="#fff" fill-opacity=".16"/><g stroke="#fff" stroke-opacity=".7" stroke-width="14" stroke-linecap="round"><line x1="88" y1="128" x2="170" y2="80"/><line x1="88" y1="128" x2="170" y2="176"/></g><circle cx="84" cy="128" r="30" fill="#fff"/><circle cx="174" cy="78" r="28" fill="#fff" fill-opacity=".9"/><circle cx="174" cy="178" r="28" fill="#fff" fill-opacity=".9"/></svg>
			NHR Social Share
		</div>
		<h1>Share each post where its readers are</h1>
		<p>Share buttons · Link previews · LinkedIn · No tracking</p>
	</div>
	<div class="card">
		<div class="og">
			<div class="site"><i></i>My Blog</div>
			<h2>Three ways to share a link on LinkedIn</h2>
			<div class="foot"><b>Writing</b><span>example.com</span></div>
		</div>
		<div class="meta"><strong>Three ways to share a link on LinkedIn</strong>example.com</div>
		<div class="btns"><span class="on">LinkedIn</span><span>X</span><span>Reddit</span><span>Facebook</span></div>
	</div>
</div>
</body></html>
